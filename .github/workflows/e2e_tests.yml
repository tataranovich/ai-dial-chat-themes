name: E2E tests trigger

on:
  #registry_package:
  pull_request:
    branches: [development, release-*]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: E2E tests
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          repository: tataranovich/ai-dial-ci # TODO: replace with epam/ai-dial-ci before merge
          event-type: e2e-tests-workflow
          client-payload: '{"github-app": "${{github.event.repository.name}}", "github-sha": "${{github.sha}}", "gitlab-project-id": "1843"}'
